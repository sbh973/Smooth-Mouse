<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smooth Mouse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Smooth Mouse</h1>
    <button class="switch" role="switch" aria-checked="true" data-setting="enabled" aria-label="Smooth Mouse on or off">
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      <span class="switch-text">On</span>
    </button>
  </header>

  <section aria-labelledby="debug-title">
    <h2 id="debug-title">Live debug</h2>
    <p id="status" class="status" role="status">Connecting to this tab…</p>
    <dl class="stats">
      <div><dt>Movement right now</dt><dd id="movement">–</dd></div>
      <div><dt>Pointer events / sec</dt><dd id="pps">–</dd></div>
      <div><dt>Clicks</dt><dd id="clicks">–</dd></div>
      <div><dt>Double-clicks</dt><dd id="dblclicks">–</dd></div>
      <div><dt>Keys pressed</dt><dd id="keys">–</dd></div>
      <div><dt>Samples in 3 s buffer</dt><dd id="recent">–</dd></div>
    </dl>
    <p class="note">Movement labels are engineering labels, not a diagnosis.</p>
  </section>

  <section aria-labelledby="options-title">
    <h2 id="options-title">Options</h2>
    <button class="switch row" role="switch" aria-checked="true" data-setting="stabilize">
      <span class="switch-label">Stabilize cursor</span>
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
    </button>
    <button class="switch row" role="switch" aria-checked="true" data-setting="redirectClicks">
      <span class="switch-label">Click where the steady cursor is</span>
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
    </button>
    <button class="switch row" role="switch" aria-checked="false" data-setting="showBadgeEverywhere">
      <span class="switch-label">Debug badge on all sites</span>
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
    </button>
  </section>

  <footer>
    <button id="calibrate" class="secondary">Calibrate (coming soon)</button>
  </footer>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
