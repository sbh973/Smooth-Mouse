<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth Mouse video scenes</title>
<!--
  Animated scenes for the 2-minute demo video. Open this file in a browser,
  make it full screen (press F), and screen-record each scene.
  Press 1-9 to play a scene, Esc to go back to the menu. See DEMO.md.
-->
<style>
  :root {
    --teal: #0F766E; --teal-light: #5EEAD4; --ink: #102A43; --ink-2: #0A1B2C;
    --bg: #F3F6F7; --muted: #829AB1; --warn: #B4441A; --warn-light: #FF9466;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.playing { cursor: none; }

  /* 1920x1080 stage, scaled to fit the window */
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform: translate(-50%, -50%); overflow: hidden; background: var(--ink); color: #fff;
  }
  .scene { position: absolute; inset: 0; }
  .light { background: var(--bg); color: var(--ink); }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* Simple timed reveals: every .in element fades/slides in at its --at delay */
  .in { opacity: 0; transform: translateY(40px); animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--at, 0s); }
  .out { animation: fade-out .5s ease forwards; animation-delay: var(--at, 0s); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fade-out { to { opacity: 0; transform: translateY(-30px); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.8); } 70% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }

  /* --- Menu --- */
  #menu {
    position: fixed; inset: 0; z-index: 10; background: rgba(10, 27, 44, .96); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #menu h1 { margin: 0; font-size: 30px; }
  #menu p { margin: 0; color: #BCCCDC; font-size: 16px; }
  #menu ol { list-style: none; padding: 0; margin: 10px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #menu button {
    width: 340px; min-height: 52px; padding: 10px 16px; border-radius: 12px; border: 1px solid #334E68;
    background: #102A43; color: #fff; font: inherit; font-size: 16px; text-align: left; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  #menu button:hover { background: #243B53; border-color: var(--teal-light); }
  #menu button:focus-visible { outline: 3px solid var(--teal-light); outline-offset: 2px; }
  #menu .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
  #menu kbd { background: #243B53; border-radius: 6px; padding: 2px 8px; font: inherit; }
  body.playing #menu { display: none; }

  /* --- Cold open: the accidental purchase --- */
  .store { position: absolute; left: 460px; top: 170px; width: 1000px; height: 660px; background: #fff; border-radius: 28px; box-shadow: 0 30px 80px rgba(16,42,67,.18); }
  .store .tv { position: absolute; left: 60px; top: 60px; width: 400px; height: 260px; border-radius: 16px; background: linear-gradient(135deg, #243B53, #102A43 60%, #0F766E); border: 10px solid #1F2933; }
  .store .info { position: absolute; left: 500px; top: 70px; right: 50px; }
  .store h2 { margin: 0 0 12px; font-size: 46px; line-height: 1.1; }
  .store .price { font-size: 64px; font-weight: 800; margin: 18px 0 0; }
  .store .stars { color: #E3A008; font-size: 30px; letter-spacing: 4px; }
  .sbtn { position: absolute; top: 470px; height: 96px; border-radius: 18px; font-size: 34px; font-weight: 750; display: flex; align-items: center; justify-content: center; transition: transform .08s, filter .08s; }
  .sbtn.buy { left: 140px; width: 340px; background: #F59E0B; color: #1F2933; }
  .sbtn.no { left: 500px; width: 340px; background: #E4E7EB; color: #1F2933; }
  .sbtn.pressed { transform: scale(.95); filter: brightness(.85); }
  .order { position: absolute; inset: 0; border-radius: 28px; background: #ECFDF5; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .order.show { display: flex; animation: pop .45s ease forwards; }
  .order .tick { width: 130px; height: 130px; border-radius: 50%; background: #059669; color: #fff; font-size: 80px; display: flex; align-items: center; justify-content: center; }
  .order h2 { font-size: 64px; margin: 26px 0 8px; color: #065F46; }
  .order p { font-size: 34px; margin: 0; color: #064E3B; }
  .cursor { position: absolute; left: 0; top: 0; width: 54px; height: 54px; pointer-events: none; z-index: 5; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .caption { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 56px; font-weight: 800; color: var(--ink); }
  .blackout { position: absolute; inset: 0; background: var(--ink-2); opacity: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 200px; }
  .blackout.show { animation: rise .8s ease forwards; transform: none; }
  .blackout p { font-size: 72px; font-weight: 800; line-height: 1.2; margin: 0; color: #fff; }
  .blackout em { font-style: normal; color: var(--warn-light); }

  /* --- Stats --- */
  .stat { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 180px; }
  .stat .num { font-size: 260px; font-weight: 850; line-height: 1; color: var(--teal-light); font-variant-numeric: tabular-nums; letter-spacing: -6px; }
  .stat .label { font-size: 60px; font-weight: 700; margin-top: 30px; line-height: 1.2; max-width: 1400px; }
  .stat .src { font-size: 26px; color: var(--muted); margin-top: 34px; }
  .people { display: flex; gap: 50px; }
  .person { width: 170px; height: 300px; position: relative; }
  .person .head { position: absolute; left: 45px; top: 0; width: 80px; height: 80px; border-radius: 50%; background: currentColor; }
  .person .body { position: absolute; left: 20px; top: 95px; width: 130px; height: 205px; border-radius: 65px 65px 24px 24px; background: currentColor; }
  .person.shake { color: var(--warn-light); animation: tremor .19s linear infinite; }
  .person.calm { color: #486581; }
  @keyframes tremor { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-7px,2px) rotate(-1.5deg); } 50% { transform: translate(6px,-2px) rotate(1deg); } 75% { transform: translate(-4px,-1px) rotate(-.5deg); } 100% { transform: translate(0,0); } }
  .punch p { font-size: 110px; font-weight: 850; margin: 0; line-height: 1.1; }
  .punch em { font-style: normal; color: var(--warn-light); }

  /* --- Title --- */
  .title-wrap svg { width: 1100px; height: 260px; overflow: visible; }
  .title-wrap h1 { font-size: 150px; margin: 10px 0 0; letter-spacing: -4px; font-weight: 850; }
  .title-wrap .tag { font-size: 54px; color: var(--teal-light); font-weight: 650; margin-top: 18px; }

  /* --- Section / feature cards --- */
  .feature { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 140px; gap: 80px; }
  .feature .idx { font-size: 40px; font-weight: 800; color: var(--teal-light); letter-spacing: 2px; }
  .feature h2 { font-size: 110px; line-height: 1.02; margin: 18px 0 30px; letter-spacing: -3px; font-weight: 850; }
  .feature p { font-size: 44px; line-height: 1.35; margin: 0; color: #D9E2EC; max-width: 760px; }
  .feature .art { height: 640px; border-radius: 36px; background: #0A1B2C; border: 2px solid #243B53; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .art canvas { width: 100%; height: 100%; }
  .legend { position: absolute; left: 40px; bottom: 30px; font-size: 30px; display: flex; gap: 40px; }
  .legend .r { color: var(--warn-light); } .legend .s { color: var(--teal-light); }

  .steps { display: grid; gap: 34px; }
  .step { display: flex; align-items: center; gap: 30px; font-size: 48px; font-weight: 700; }
  .step .n { width: 86px; height: 86px; border-radius: 50%; border: 4px solid var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--teal-light); flex: none; }
  .step.done .n { background: var(--teal-light); color: var(--ink); }

  .ring-demo { display: flex; gap: 90px; align-items: center; }
  .ring-demo figure { margin: 0; text-align: center; }
  .ring-demo svg { width: 230px; height: 230px; }
  .ring-demo figcaption { font-size: 36px; font-weight: 700; margin-top: 20px; }
  .ring-fill { stroke-dasharray: 597; stroke-dashoffset: 597; }

  .typing { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 130px; font-weight: 700; letter-spacing: 4px; }
  .typing .extra { color: var(--warn-light); display: inline-block; transition: all .45s ease; }
  .typing .extra.gone { opacity: 0; max-width: 0; transform: translateY(-40px); }
  .typing .caret { display: inline-block; width: 8px; height: 120px; background: var(--teal-light); vertical-align: -14px; margin-left: 6px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .key-note { position: absolute; bottom: 60px; font-size: 32px; color: #BCCCDC; }

  .mini-dialog { width: 680px; background: #fff; color: var(--ink); border-radius: 30px; padding: 46px; box-shadow: 0 30px 80px rgba(0,0,0,.45); opacity: 0; animation: pop .5s ease forwards; animation-delay: .5s; }
  .mini-dialog h3 { font-size: 50px; margin: 0 0 16px; line-height: 1.15; }
  .mini-dialog .gem { display: inline-block; font-size: 24px; font-weight: 750; color: var(--teal); background: #E6F4F1; border: 2px solid var(--teal); border-radius: 999px; padding: 4px 16px; margin-bottom: 30px; }
  .mini-dialog .row { display: flex; gap: 20px; }
  .mini-dialog .b { flex: 1; height: 96px; border-radius: 18px; font-size: 34px; font-weight: 750; display: flex; align-items: center; justify-content: center; }
  .mini-dialog .no { background: var(--teal); color: #fff; box-shadow: 0 0 0 6px rgba(15,118,110,.3); }
  .mini-dialog .yes { border: 3px solid #BCCCDC; }

  /* --- Outro --- */
  .recap { display: grid; grid-template-columns: repeat(4, 340px); gap: 30px; margin: 60px 0 70px; }
  .recap div { background: #0A1B2C; border: 2px solid #243B53; border-radius: 28px; padding: 34px 26px; font-size: 36px; font-weight: 750; line-height: 1.2; }
  .recap span { display: block; color: var(--teal-light); font-size: 28px; margin-bottom: 12px; }
  .split { font-size: 54px; font-weight: 750; line-height: 1.3; }
  .split b { color: var(--teal-light); }
  .fine { font-size: 26px; color: var(--muted); margin-top: 50px; }
</style>
</head>
<body>
<div id="stage" aria-live="off"></div>

<div id="menu" role="dialog" aria-label="Choose a scene">
  <h1>Smooth Mouse · video scenes</h1>
  <p>Press <kbd>F</kbd> for full screen, start your screen recording, then play a scene. <kbd>Esc</kbd> returns here.</p>
  <ol id="scene-list"></ol>
  <p>Order and voice-over are in <strong>DEMO.md</strong>. Each scene holds its last frame, so you can trim it in your editor.</p>
</div>

<script>
const stage = document.getElementById("stage");
const W = 1920, H = 1080;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  stage.style.transformOrigin = "center";
}
addEventListener("resize", fit); fit();

// Timers and animation frames for the current scene, so Esc can stop everything.
let timers = [], frames = [];
const later = (sec, fn) => timers.push(setTimeout(fn, sec * 1000));
function loop(fn) {
  const t0 = performance.now();
  const tick = (now) => { if (fn((now - t0) / 1000) !== false) frames.push(requestAnimationFrame(tick)); };
  frames.push(requestAnimationFrame(tick));
}
function stopAll() { timers.forEach(clearTimeout); frames.forEach(cancelAnimationFrame); timers = []; frames = []; }
const html = (s) => { const d = document.createElement("div"); d.innerHTML = s.trim(); return d.firstElementChild; };
const ease = (t) => (t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3));
const CURSOR_SVG = `<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11.5-6.6 1 3.9 7.2-2.9 1.5-3.9-7.3L4 20.5z" fill="#fff" stroke="#102A43" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

/** Count a number up from 0 (keeps the text around it). */
function countUp(el, to, decimals, sec, fmt) {
  loop((t) => {
    const v = to * ease(t / sec);
    el.textContent = fmt(v.toFixed(decimals));
    return t < sec;
  });
}

// ---------------------------------------------------------------------------
// Scenes
// ---------------------------------------------------------------------------
const SCENES = [
  { key: "open", name: "Cold open: the accidental purchase", dur: 12, play: coldOpen },
  { key: "stats", name: "Tremor statistics", dur: 17, play: stats },
  { key: "title", name: "Title: Smooth Mouse", dur: 5, play: title },
  { key: "calib", name: "Calibration card", dur: 4, play: calibration },
  { key: "f1", name: "Feature 1: smoothing", dur: 3.5, play: () => feature(1) },
  { key: "f2", name: "Feature 2: timed clicks", dur: 3.5, play: () => feature(2) },
  { key: "f3", name: "Feature 3: repeated keys", dur: 3.5, play: () => feature(3) },
  { key: "f4", name: "Feature 4: risky buttons", dur: 3.5, play: () => feature(4) },
  { key: "outro", name: "Outro", dur: 12, play: outro },
];

function coldOpen() {
  const s = html(`<div class="scene light">
    <div class="store">
      <div class="tv"></div>
      <div class="info">
        <h2>UltraView 85″ 8K Smart TV</h2>
        <div class="stars">★★★★★</div>
        <div class="price">$1,899</div>
      </div>
      <div class="sbtn buy">Buy now</div>
      <div class="sbtn no">No thanks</div>
      <div class="order"><div class="tick">✓</div><h2>Order placed!</h2><p>UltraView 85″ TV · $1,899 · non-refundable</p></div>
    </div>
    <div class="caption" style="opacity:0"></div>
    <div class="blackout"><p>For millions of people with hand tremors,<br><em>this happens every day.</em></p></div>
  </div>`);
  s.insertAdjacentHTML("beforeend", CURSOR_SVG);
  stage.appendChild(s);
  const cur = s.querySelector(".cursor"), buy = s.querySelector(".buy"), order = s.querySelector(".order"), cap = s.querySelector(".caption");
  // Button centres on the stage: "No thanks" is the goal, "Buy now" is right next to it.
  const start = { x: 1600, y: 960 }, goal = { x: 460 + 500 + 170, y: 170 + 470 + 48 }, slip = { x: 460 + 140 + 170, y: 170 + 470 + 48 };
  const ph = Math.random() * 6;
  loop((t) => {
    let base;
    if (t < 3.2) { const k = ease(t / 3.2); base = { x: start.x + (goal.x - start.x) * k, y: start.y + (goal.y - start.y) * k }; }
    else if (t < 5.2) base = goal;
    else { const k = ease((t - 5.2) / 0.12); base = { x: goal.x + (slip.x - goal.x) * k, y: goal.y }; }
    // Tremor: ~5 Hz wobble plus noise, growing while they try to hold still on the button.
    const amp = t < 5.3 ? 10 + 22 * Math.min(1, t / 4) : 0;
    const x = base.x + amp * Math.sin(2 * Math.PI * 5 * t + ph) + (Math.random() - .5) * amp * .5;
    const y = base.y + amp * .7 * Math.cos(2 * Math.PI * 4.3 * t) + (Math.random() - .5) * amp * .5;
    cur.style.transform = `translate(${x - 8}px, ${y - 4}px)`;
    return t < 12;
  });
  later(1.0, () => { cap.textContent = "Just trying to click “No thanks”…"; cap.style.transition = "opacity .4s"; cap.style.opacity = 1; });
  later(5.3, () => buy.classList.add("pressed"));
  later(5.45, () => buy.classList.remove("pressed"));
  later(5.8, () => { order.classList.add("show"); cap.textContent = "…oops."; });
  later(8.6, () => s.querySelector(".blackout").classList.add("show"));
}

function stats() {
  const s = html(`<div class="scene"></div>`);
  stage.appendChild(s);
  const slides = [
    { num: (el) => countUp(el, 8.5, 1, 1.4, (v) => `${v}M+`), label: "people worldwide live with Parkinson’s disease", src: "World Health Organization, 2022" },
    { num: (el) => countUp(el, 2, 0, 1.0, (v) => `${v}×`), label: "more people have Parkinson’s than 25 years ago", src: "World Health Organization, 2022" },
    { num: (el) => countUp(el, 7, 0, 1.2, (v) => `~${v}M`), label: "Americans have essential tremor, the most common movement disorder", src: "Louis & Ottman, Tremor and Other Hyperkinetic Movements, 2014" },
    { people: true, label: "people with Parkinson’s experience tremor", src: "Clinical studies estimate about 75%" },
  ];
  const each = 3.5;
  slides.forEach((d, i) => later(i * each, () => {
    s.innerHTML = "";
    const el = html(`<div class="stat">
      ${d.people
        ? `<div class="people in">${[1,1,1,0].map((sh) => `<div class="person ${sh ? "shake" : "calm"}"><div class="head"></div><div class="body"></div></div>`).join("")}</div>
           <div class="num in" style="--at:.3s;font-size:150px;margin-top:40px;letter-spacing:-3px">3 in 4</div>`
        : `<div class="num in">0</div>`}
      <div class="label in" style="--at:.35s">${d.label}</div>
      <div class="src in" style="--at:.6s">${d.src}</div>
    </div>`);
    s.appendChild(el);
    if (d.num) d.num(el.querySelector(".num"));
  }));
  later(slides.length * each, () => {
    s.innerHTML = `<div class="stat punch"><p class="in">The web wasn’t built</p><p class="in" style="--at:.35s">for <em>shaky hands.</em></p></div>`;
  });
}

function title() {
  const s = html(`<div class="scene center title-wrap">
    <svg viewBox="0 0 1100 260"><path id="wave" fill="none" stroke-width="16" stroke-linecap="round"/><g id="tip"></g></svg>
    <h1 class="in" style="--at:1.4s">Smooth Mouse</h1>
    <div class="tag in" style="--at:1.9s">Steady clicks for shaky hands.</div>
  </div>`);
  stage.appendChild(s);
  const wave = s.querySelector("#wave"), tip = s.querySelector("#tip");
  tip.innerHTML = `<path d="M0 -34 L52 0 L0 34 L12 0 Z" fill="#5EEAD4"/>`;
  // A shaky line that calms down into a straight one (the whole idea, in one shape).
  loop((t) => {
    const calm = ease((t - 0.3) / 1.4);
    const amp = 60 * (1 - calm);
    let d = "";
    for (let i = 0; i <= 120; i++) {
      const x = 40 + i * 8.5;
      const y = 130 + amp * Math.sin(i * 0.9 + t * 14) * (0.5 + 0.5 * Math.sin(i * 0.17));
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    wave.setAttribute("d", d);
    const hue = calm; // orange -> teal
    wave.setAttribute("stroke", `rgb(${Math.round(255 - 161 * hue)}, ${Math.round(148 + 86 * hue)}, ${Math.round(102 + 110 * hue)})`);
    tip.setAttribute("transform", `translate(${40 + 120 * 8.5 + 10}, 130)`);
    return t < 5;
  });
}

function calibration() {
  const s = html(`<div class="scene feature">
    <div>
      <div class="idx in">STEP ONE</div>
      <h2 class="in" style="--at:.15s">One minute of calibration</h2>
      <p class="in" style="--at:.3s">Smooth Mouse learns how <em>your</em> hand moves, then recommends the right protections.</p>
    </div>
    <div class="steps">
      <div class="step in" style="--at:.6s"><span class="n">1</span>Hold the cursor still</div>
      <div class="step in" style="--at:1.1s"><span class="n">2</span>Click 5 circles</div>
      <div class="step in" style="--at:1.6s"><span class="n">3</span>Type one sentence</div>
    </div>
  </div>`);
  stage.appendChild(s);
  s.querySelectorAll(".step").forEach((el, i) => later(1.5 + i * 0.6, () => { el.classList.add("done"); el.querySelector(".n").textContent = "✓"; }));
}

function feature(n) {
  const F = {
    1: { title: "Movement smoothing", text: "An on-device ML model spots shaking in real time and smooths only then. Intentional moves stay fast.",
         art: `<canvas width="760" height="640"></canvas><div class="legend"><span class="r">● your hand</span><span class="s">● steady cursor</span></div>` },
    2: { title: "Timed clicks", text: "Quick, shaky taps are ignored. Hold for your calibrated time and the click counts.",
         art: `<div class="ring-demo">
           <figure><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="95" fill="none" stroke="#243B53" stroke-width="18"/><circle class="ring-fill tap" cx="115" cy="115" r="95" fill="none" stroke="#FF9466" stroke-width="18" transform="rotate(-90 115 115)" stroke-linecap="round"/></svg><figcaption class="tap-cap">Quick tap</figcaption></figure>
           <figure><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="95" fill="none" stroke="#243B53" stroke-width="18"/><circle class="ring-fill hold" cx="115" cy="115" r="95" fill="none" stroke="#5EEAD4" stroke-width="18" transform="rotate(-90 115 115)" stroke-linecap="round"/></svg><figcaption class="hold-cap">Hold</figcaption></figure></div>` },
    3: { title: "Repeated key filter", text: "Accidental double presses disappear. Real double letters stay.",
         art: `<div class="typing"><span class="extra">h</span>hello<span class="caret"></span></div><div class="key-note">“hhello” → “hello”</div>` },
    4: { title: "Risky button warning", text: "Gemini reads the page, even icon-only buttons. When your hand is shaking, Smooth Mouse asks before you send, delete or buy.",
         art: `<div class="mini-dialog"><h3>Did you mean to click “Buy now”?</h3><span class="gem">Checked by Gemini · places an order</span><div class="row"><div class="b yes">Yes, buy it</div><div class="b no">No, go back</div></div></div>` },
  }[n];
  const s = html(`<div class="scene feature">
    <div>
      <div class="idx in">FEATURE 0${n}</div>
      <h2 class="in" style="--at:.12s">${F.title}</h2>
      <p class="in" style="--at:.3s">${F.text}</p>
    </div>
    <div class="art in" style="--at:.2s">${F.art}</div>
  </div>`);
  stage.appendChild(s);

  if (n === 1) {
    const c = s.querySelector("canvas"), g = c.getContext("2d");
    const raw = [], steady = [];
    let sx = null, sy = null;
    loop((t) => {
      const k = Math.min(1, t / 2.6);
      const bx = 80 + 600 * k, by = 320 + 120 * Math.sin(k * Math.PI * 1.2);
      const rx = bx + 26 * Math.sin(t * 31) + (Math.random() - .5) * 18, ry = by + 26 * Math.cos(t * 27) + (Math.random() - .5) * 18;
      sx = sx === null ? rx : sx + (bx - sx) * 0.25; sy = sy === null ? ry : sy + (by - sy) * 0.25;
      if (t < 2.7) { raw.push([rx, ry]); steady.push([sx, sy]); }
      g.clearRect(0, 0, 760, 640);
      const draw = (pts, color, w) => { g.strokeStyle = color; g.lineWidth = w; g.lineJoin = g.lineCap = "round"; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); };
      draw(raw, "rgba(255,148,102,.85)", 4); draw(steady, "#5EEAD4", 9);
      return t < 3.5;
    });
  }
  if (n === 2) {
    const tap = s.querySelector(".tap"), hold = s.querySelector(".hold");
    later(0.5, () => { tap.style.transition = "stroke-dashoffset .15s linear"; tap.style.strokeDashoffset = 597 * 0.8; });
    later(0.8, () => { tap.style.transition = "stroke-dashoffset .3s"; tap.style.strokeDashoffset = 597; s.querySelector(".tap-cap").innerHTML = "Quick tap: <span style='color:#FF9466'>ignored</span>"; });
    later(1.1, () => { hold.style.transition = "stroke-dashoffset 1s linear"; hold.style.strokeDashoffset = 0; });
    later(2.15, () => { s.querySelector(".hold-cap").innerHTML = "Hold: <span style='color:#5EEAD4'>clicked ✓</span>"; });
  }
  if (n === 3) later(1.4, () => s.querySelector(".extra").classList.add("gone"));
}

function outro() {
  const s = html(`<div class="scene center">
    <div class="split in">Our model understands <b>your hands</b>.<br>Gemini understands <b>the page</b>.</div>
    <div class="recap">
      <div class="in" style="--at:1.0s"><span>01</span>Movement smoothing</div>
      <div class="in" style="--at:1.2s"><span>02</span>Timed clicks</div>
      <div class="in" style="--at:1.4s"><span>03</span>Repeated key filter</div>
      <div class="in" style="--at:1.6s"><span>04</span>Risky button warning</div>
    </div>
    <div class="title-wrap"><h1 class="in" style="--at:2.6s;font-size:120px">Smooth Mouse</h1><div class="tag in" style="--at:3s">Steady clicks for shaky hands.</div></div>
    <div class="fine in" style="--at:3.6s">Emory Hacks 2026 · Movement data never leaves your computer · Not a medical device</div>
  </div>`);
  stage.appendChild(s);
}

// ---------------------------------------------------------------------------
// Menu and keys
// ---------------------------------------------------------------------------
const list = document.getElementById("scene-list");
SCENES.forEach((sc, i) => {
  const li = document.createElement("li");
  li.innerHTML = `<button type="button"><span><kbd>${i + 1}</kbd> ${sc.name}</span><span class="dur">${sc.dur}s</span></button>`;
  li.querySelector("button").addEventListener("click", () => play(i));
  list.appendChild(li);
});

function play(i) {
  stopAll();
  stage.innerHTML = "";
  document.body.classList.add("playing");
  // Short pause first, so you have time to start trimming from a clean frame.
  later(0.6, () => SCENES[i].play());
}
function backToMenu() { stopAll(); stage.innerHTML = ""; document.body.classList.remove("playing"); list.querySelector("button").focus(); }

addEventListener("keydown", (e) => {
  if (e.key === "Escape") backToMenu();
  else if (e.key === "f" || e.key === "F") (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  else if (/^[1-9]$/.test(e.key) && SCENES[e.key - 1]) play(e.key - 1);
});
</script>
